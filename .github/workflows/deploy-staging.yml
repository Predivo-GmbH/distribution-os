name: Deploy to Staging

# Staging environment for staging.distributionos.predivo.ch — review changes
# (incl. E2E) BEFORE they reach production. Modeled on the fleet pattern
# (ScoutCopilot deploy-staging + BackOffice self-healing .htpasswd).
#
# Trigger: push to the `staging` branch (or manual dispatch). Production is a
# SEPARATE workflow (deploy.yml, on `master`) and is never touched by this one.
#
# Protection: deployed .htaccess prepends HTTP Basic auth; the .htpasswd itself
# is SELF-HEALING — uploaded from the STAGING_HTPASSWD_LINE secret on every
# deploy — plus X-Robots-Tag noindex and a disallow-all robots.txt. The
# in-app PasswordGate is disabled on staging builds (basic auth replaces it,
# and the E2E suite needs the pages reachable).

on:
  push:
    branches: [staging]
    paths-ignore:
      # '*.md' matches ROOT-LEVEL markdown only in GitHub Actions, so a docs-only change
      # in any subfolder still triggered a full deploy. No markdown in this repo is a
      # build input (checked for `import ... .md`, `?raw` and import.meta.glob), so it
      # is safe to ignore markdown at any depth.
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  STAGING_URL: https://staging.distributionos.predivo.ch
  STAGING_DOCROOT: staging.distributionos.predivo.ch

jobs:
  deploy-staging:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml
          cache-dependency-path: app/package-lock.json

      # Migrations ship BEFORE any code (ReplyFlow drift fix 2026-08-21, proven
      # BackOffice route): staging project jckctrtkstejolddqzlk, same script as prod.
      - name: Apply database migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref jckctrtkstejolddqzlk

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Lint + unit tests
        working-directory: app
        run: |
          npm run lint
          npx vitest run

      # NOT `working-directory: app`, and that is the entire point. The vitest run above uses
      # app/vitest.config.ts, whose include is 'src/**' relative to app/ - so it cannot see a
      # *.test.mjs under supabase/, two directory levels outside it. Measured 2026-09-03:
      # supabase/functions/_shared/smtp-retry.test.mjs (13 checks, all passing - the guard against
      # the "Connection timeout" mail failure that hit SignalScore in production) had never been
      # executed by CI once. Not skipped: unreachable, which looked identical to green.
      # This step DISCOVERS every *.test.mjs from the repo root rather than naming any, so a guard
      # added tomorrow runs tomorrow with nobody editing this file. It fails if discovery matches
      # nothing, because absence is not success. Needs no node_modules.
      - name: Guard suites (discovered, not listed)
        run: node scripts/run-guards.mjs

      - name: Build for staging
        working-directory: app
        env:
          # Isolated staging backend: the deployed staging site talks to the
          # dedicated staging Supabase project (jckctrtkstejolddqzlk — migrations +
          # edge fns provisioned), never prod. Client-safe publishable key only.
          # The E2E helper derives the session-storage ref from E2E_SUPABASE_URL
          # (below) so its fake session matches this project.
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_PASSWORD_GATE_DISABLED: 'true'
        run: npm run build

      - name: Prepare staging .htaccess + robots (basic auth, noindex)
        run: |
          # Keep the production .htaccess (headers/cache/SPA behaviour) and
          # prepend the staging gate so Apache config errors surface here too.
          {
            echo 'AuthType Basic'
            echo 'AuthName "Distribution-OS Staging"'
            echo "AuthUserFile /var/www/vhosts/predivo.ch/${STAGING_DOCROOT}/.htpasswd"
            echo 'Require valid-user'
            echo ''
            echo '<IfModule mod_headers.c>'
            echo 'Header set X-Robots-Tag "noindex, nofollow"'
            echo '</IfModule>'
            echo ''
            cat app/dist/.htaccess 2>/dev/null || true
          } > /tmp/staging.htaccess
          mv /tmp/staging.htaccess app/dist/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > app/dist/robots.txt
          echo 'distributionos-staging' > app/dist/.site-id

      - name: Deploy staging via FTPS (self-healing .htpasswd)
        env:
          HTPASSWD_LINE: ${{ secrets.STAGING_HTPASSWD_LINE }}
        run: |
          set +e
          sudo apt-get install -y lftp >/dev/null
          FTP_CONN="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }};"

          # The docroot is created by Plesk when the subdomain exists — refuse
          # to deploy into a missing/unexpected target.
          LISTING=$(timeout 90 lftp -e "${FTP_CONN} cls -1 /; quit" 2>/dev/null)
          if ! echo "$LISTING" | grep -qE "(^|/)${STAGING_DOCROOT}/?$"; then
            echo "::error::DEPLOY ABORTED — /${STAGING_DOCROOT}/ does not exist on the FTP server. Create the subdomain in Plesk first."
            exit 1
          fi

          printf '%s\n' "$HTPASSWD_LINE" > /tmp/.htpasswd
          # assets/ is excluded from the --delete mirror below: old hashed chunks must
          # survive ~14 days for browser tabs still running an old index.html (fleet
          # standard §5a) - they are pruned by AGE in the step after this one.
          for i in 1 2 3; do
            OUT=$(timeout 420 lftp -e "
              $FTP_CONN
              put /tmp/.htpasswd -o /${STAGING_DOCROOT}/.htpasswd;
              mirror --reverse --no-perms --verbose ./app/dist/assets/ /${STAGING_DOCROOT}/assets/; mirror --reverse --delete --no-perms --verbose --exclude '^assets/' --exclude .htpasswd --exclude cgi-bin/ ./app/dist/ /${STAGING_DOCROOT}/;
              bye" 2>&1)
            CODE=$?
            echo "$OUT" | tail -5
            [ $CODE -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth failed (530), not retrying"; exit 1; }
            echo "lftp attempt $i failed (exit $CODE) — retrying"
            sleep 10
          done
          exit $CODE

      - name: Staging alive smoke
        run: |
          for i in $(seq 1 8); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" "$STAGING_URL" --max-time 30 || echo 000)
            echo "attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 8
          done
          echo "::error::Staging did not come up (last HTTP $STATUS)"
          exit 1

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the asset-retention exclusion above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659, supported by the ProFTPD on this host) and deletes files older than
        # 14 days. 14 days ≫ any realistically open tab, so stale-tab chunk fetches 404
        # only for sessions older than the retention window.
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: staging.distributionos.predivo.ch/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively —
            # nested chunk dirs are covered too); normalize to a path relative to
            # ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

  e2e-staging:
    needs: deploy-staging
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright
        working-directory: app
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Frontend-artifact gate ONLY — validates the deployed staging site renders
      # and routes (all public routes + the launch-critical legal pages). These
      # specs make ZERO backend calls, so a staging deploy never writes to any
      # database. The backend-integration suite (critical-path.spec.ts, which
      # does CRUD + Stripe + ai_usage writes) runs in test.yml against the real
      # backend — running it here too would only duplicate that AND pollute prod.
      - name: "E2E against live staging (frontend: smoke + public pages)"
        working-directory: app
        env:
          E2E_STAGING_URL: ${{ env.STAGING_URL }}
          E2E_STAGING_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          E2E_STAGING_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          BASE_URL: ${{ env.STAGING_URL }}
          # Lets the helper seed the fake session under the STAGING project's
          # sb-<ref>-auth-token key (matches the deployed staging build above).
          E2E_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
        run: npx playwright test e2e/smoke.spec.ts e2e/public-pages.spec.ts --project=chromium
