name: v11 Staging Gates

# Runs the v11 hardened audit gates (app/e2e/staging/v11-gates.spec.ts) against the LIVE
# staging site (staging.distributionos.predivo.ch):
#   Gate A   constrained-viewport reachability (off-screen critical-control class)
#   Gate B/J create-product commit-boundary + zero-residue
#   Gate I   correctness under real data volume (>1000-row PostgREST cap)
#   Gate K   fault-injected 500/empty loads render gracefully
#   Gate M   deployed-bundle identity — staging bundle talks to STAGING, never prod
# A red run here IS the alert (same model as the fleet grant-drift/auth-email guards).
# DELIBERATELY separate from the deploy gauntlet (needs the Management token) and it never
# touches production: every seed/cleanup is a marker-scoped SQL statement on the STAGING ref.

on:
  workflow_run:
    workflows: ['Deploy to Staging'] # re-verify staging right after every staging deploy
    types: [completed]
  schedule:
    - cron: '30 6 * * 1' # weekly Mon 06:30 UTC (after the fleet monitors)
  workflow_dispatch: {}

concurrency:
  group: v11-staging-gates
  # NOT cancel-in-progress. This gate takes ~35 minutes and the group is a constant, so any
  # newer run killed the one in flight, often at minute 34. Measured 2026-08-24 across the
  # seven repos that run it: 40 of 133 recent runs ended `cancelled`, 30 percent, and
  # BackOffice had 1 success and 0 failures against 12 cancellations. A cancelled gate is
  # not a failing gate, so the dashboard looked clean while the gate was barely reporting.
  # With false, the running gate finishes; GitHub keeps at most one run pending, so a newer
  # commit still supersedes an older WAITING one without destroying a verdict in progress.
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    # Skip when a Deploy run FAILED (nothing new to verify); always run on schedule/manual.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # (No separate curl alive-check: auth.setup navigates to staging and fails fast if it's
      # down/500, so a dead staging already turns this workflow red — and it avoids embedding a
      # `curl -u user:pass` pattern that trips secret scanners.)
      - name: Run v11 hardened gates against staging
        run: npx playwright test --config playwright.v11-gates.config.ts
        env:
          STAGING_URL: https://staging.distributionos.predivo.ch
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTTP_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          STAGING_REF: jckctrtkstejolddqzlk
          # Supabase Management API token (seed/count/cleanup on the STAGING ref only).
          DIST_MGMT_TOKEN: ${{ secrets.DIST_MGMT_TOKEN }}
          # Real staging login for auth.setup.ts.
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: v11-gates-report
          path: app/playwright-report/
          retention-days: 7
