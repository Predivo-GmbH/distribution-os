name: Deploy to Production

# PRODUCTION is a MANUAL promotion (fleet standard, 2026-08-16). A push to
# `master` no longer auto-deploys prod — promote with:
#   gh workflow run deploy.yml -f confirm=deploy
# Staging stays branch-based (push `staging` -> deploy-staging.yml). Prod is
# gated behind gate-security (secret scan + dependency audit).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true

concurrency:
  group: deploy-production
  # Never cancel a mid-flight FTP mirror — a cancelled mirror --delete can leave
  # production in a half-uploaded/half-deleted state (breakage investigation §6).
  cancel-in-progress: false

jobs:
  # SECURITY GATE — secret scan + dependency audit; the prod `deploy` job needs
  # it, so prod cannot ship with a committed secret or a critical-severity
  # advisory. Rolled out 2026-08-16 (fleet hardening); mirrors ReplyFlow/CM.
  # Audit floor now at `high` (fleet-hardening Wave 3).
  gate-security:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
      - name: 'Secret scan: full history (AUDIT only, non-blocking)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (blocking at high)
        run: npm audit --audit-level=high
        working-directory: app
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet --user --break-system-packages semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    if: github.event.inputs.confirm == 'deploy'
    needs: [gate-security]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Migrations ship BEFORE any code (ReplyFlow drift fix 2026-08-21, proven
      # BackOffice route): the database is migrated first, so a migration failure
      # fails the deploy loudly instead of shipping code against a stale schema.
      - name: Apply database migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref jxjpbmkgmuunpayqgbsx

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('app/package-lock.json') }}
      - name: Install deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: app

      - name: Coverage
        run: npm run test:coverage
        working-directory: app

      # NOT `working-directory: app`, and that is the entire point. The coverage run above uses
      # app/vitest.config.ts, whose include is 'src/**' relative to app/, so it cannot see a
      # *.test.mjs under supabase/ - two directory levels outside it. Measured 2026-09-03:
      # supabase/functions/_shared/smtp-retry.test.mjs (13 checks, all passing) had never been
      # executed by CI once. Nobody skipped it; it was unreachable, and unreachable looked exactly
      # like green. This step DISCOVERS every *.test.mjs from the repo root instead of naming any,
      # and fails if discovery matches nothing, because absence is not success.
      - name: Guard suites (discovered, not listed)
        run: node scripts/run-guards.mjs

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Launched 2026-08-02: disable the pre-launch Early-Access gate in production.
          # The gate component/tests remain; flip to remove this line to re-enable.
          VITE_PASSWORD_GATE_DISABLED: 'true'

      - name: Deploy via FTP (zero-downtime)
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUT=$(lftp…) on the
          # first failure BEFORE the retry loops below can iterate (dead-retry, deploy-standard §3f).
          set +e
          sudo apt-get install -y lftp
          FTP_CONN="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }};"

          echo "distributionos" > ./app/dist/.site-id

          REMOTE_ID=$(timeout 90 lftp -e "${FTP_CONN} cat /distributionos.predivo.ch/.site-id; quit" 2>/dev/null || echo "")
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "distributionos" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'distributionos'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Step 1: Upload new hashed assets alongside old ones (no deletion yet)
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -e "
              $FTP_CONN
              mirror --reverse --no-perms --verbose ./app/dist/assets/ /distributionos.predivo.ch/assets/;
              quit;
            " 2>&1)
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::failed after 4"; exit 1; }
            echo "::warning::attempt $n retry 25s"
            sleep 25
          done

          # Step 2: Upload index.html + root files (switches to new asset references)
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -e "
              $FTP_CONN
              put ./app/dist/.site-id -o /distributionos.predivo.ch/.site-id;
              put ./app/dist/index.html -o /distributionos.predivo.ch/index.html;
              put ./app/dist/.htaccess -o /distributionos.predivo.ch/.htaccess;
              put ./app/dist/favicon.svg -o /distributionos.predivo.ch/favicon.svg;
              put ./app/dist/favicon.ico -o /distributionos.predivo.ch/favicon.ico;
              put ./app/dist/apple-touch-icon.png -o /distributionos.predivo.ch/apple-touch-icon.png;
              put ./app/dist/android-chrome-192x192.png -o /distributionos.predivo.ch/android-chrome-192x192.png;
              put ./app/dist/android-chrome-512x512.png -o /distributionos.predivo.ch/android-chrome-512x512.png;
              put ./app/dist/og-image.png -o /distributionos.predivo.ch/og-image.png;
              put ./app/dist/site.webmanifest -o /distributionos.predivo.ch/site.webmanifest;
              put ./app/dist/robots.txt -o /distributionos.predivo.ch/robots.txt;
              put ./app/dist/sitemap.xml -o /distributionos.predivo.ch/sitemap.xml;
              quit;
            " 2>&1)
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::failed after 4"; exit 1; }
            echo "::warning::attempt $n retry 25s"
            sleep 25
          done

          # Old hashed assets are NOT deleted at deploy time: a browser tab still
          # running the old index.html fetches the old chunks lazily, and deleting
          # them turns that into "Failed to fetch dynamically imported module"
          # (fleet standard §5a). They are pruned by AGE (14 days) in the
          # "Prune stale assets" step after the smoke test below.

      - name: Post-deploy smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://distributionos.predivo.ch/" || echo 000)
          if [ "$STATUS" = "200" ]; then
            echo "OK  https://distributionos.predivo.ch/ -> $STATUS"
          else
            echo "::error::Smoke test failed: https://distributionos.predivo.ch/ -> $STATUS"
            exit 1
          fi

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the no-delete asset upload above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659, supported by the ProFTPD on this host) and deletes files older than
        # 14 days. 14 days ≫ any realistically open tab, so stale-tab chunk fetches 404
        # only for sessions older than the retention window.
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: distributionos.predivo.ch/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively —
            # nested chunk dirs are covered too); normalize to a path relative to
            # ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0
