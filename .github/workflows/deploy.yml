name: Deploy to Production

# PRODUCTION is a MANUAL promotion (fleet standard, 2026-08-16). A push to
# `master` no longer auto-deploys prod — promote with:
#   gh workflow run deploy.yml -f confirm=deploy
# Staging stays branch-based (push `staging` -> deploy-staging.yml). Prod is
# gated behind gate-security (secret scan + dependency audit).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true

concurrency:
  group: deploy-production
  # Never cancel a mid-flight FTP mirror — a cancelled mirror --delete can leave
  # production in a half-uploaded/half-deleted state (breakage investigation §6).
  cancel-in-progress: false

# ===========================================================================
# NPM CACHE / self-hosted runner — deliberately absent.
# Do not add `cache: npm` back to setup-node, and do not remove the
# `runner.environment != 'self-hosted'` guards on the actions/cache steps.
#
# These jobs run on a PERSISTENT self-hosted runner (vars.RUNNER_LABEL =
# predivo-wsl). There, ~/.npm and ~/.cache/ms-playwright are not throwaway
# caches a job populates and discards: they are directories holding everything
# this machine has ever installed, for every repo on it. The cache-save runs as
# a POST-STEP INSIDE the job's own timeout-minutes budget, so when it is slow it
# does not merely waste time — it KILLS the job.
#
# And it misses precisely when it matters: the cache key is derived from
# package-lock.json, so the save fires on exactly the dependency-changing
# commits a security gate exists to inspect. Every other commit gets a cache hit
# and sails through, which is why this stayed invisible for so long.
#
# GitHub records a timeout as `cancelled`, NOT `failed`. Every real step inside
# the job shows green, the run page looks clean, and downstream jobs with
# `needs:` are silently SKIPPED — so a production promotion can be lost without
# anything showing red. Verify the deploy JOB, never the run colour.
#
# Measured, not inferred (2026-09-02/03):
#   BoatBuddy   run 33718969126 gate-integration: npm ci 18s, tests 3s, then
#               Post Run actions/setup-node cancelled after 9m34s at
#               "Sent 1006632960 of 1811836788 (55.6%)" — a 1.81 GB upload.
#   launchready run 33664843636 gate-security cancelled -> deploy SKIPPED.
#   arivioo     runs 33659826937 / 33662539216 gate-security cancelled (~9m35s).
#   predivo     run 33792521636 critical-path killed by the PLAYWRIGHT cache
#               save (544s) — the same fault, a different cache.
#   signalscore run 33729943705 gates: Playwright cache save cancelled at 779s.
#
# The fix is to REMOVE the work that does not belong inside the budget, never to
# widen the timeout — a wider timeout hides this instead of fixing it. npm ci
# already reads the host's ~/.npm directly, so the cache bought nothing here.
# The guards keep the caches working on GitHub-hosted runners, where they are a
# genuine win and the machine is thrown away afterwards.
# ===========================================================================

jobs:
  # SECURITY GATE — secret scan + dependency audit; the prod `deploy` job needs
  # it, so prod cannot ship with a committed secret or a critical-severity
  # advisory. Rolled out 2026-08-16 (fleet hardening); mirrors ReplyFlow/CM.
  # Audit floor now at `high` (fleet-hardening Wave 3).
  gate-security:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
      - name: 'Secret scan: full history (AUDIT only, non-blocking)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (blocking at high)
        run: npm audit --audit-level=high
        working-directory: app
      # ─────────────────────────────────────────────────────────────────────────────────────
      # LIVE-PROBE GUARDS — the suites that talk to real deployed Supabase projects.
      #
      # scripts/run-guards.mjs already runs in `deploy` and in deploy-staging.yml, but only in
      # its OFFLINE mode: it carves *.prod.test.mjs / *.live.test.mjs out of the everyday run
      # deliberately, so a Supabase blip cannot redden a content push. That carve-out is only
      # legitimate while something still executes them — and until now NO workflow in this repo
      # passed --live, so the carve-out was a skip list. run-guards enforces this itself: adding
      # a *.prod.test.mjs without wiring this step makes the offline run go RED naming the file.
      #
      # Today this is the open-relay regression guard for send-auth-email
      # (signal-fleet:send-auth-email:unauthenticated-relay). The function verified a
      # Standard-Webhooks signature ONLY when one was present, and this project's Send-Email
      # hook is an UNSIGNED pg_net call — so "no signature" meant "no check" and any holder of
      # the public website key could make Distribution-OS mail a login or password-reset code
      # to an address of their choosing.
      #
      # WHY A NETWORK PROBE AND NOT A UNIT TEST. Enforcement is inert until a secret exists in
      # two places that appear in NO file in this repo — a Vault row and an edge-function env
      # var. On Valrano the code half was committed 2026-09-02 and production was STILL an open
      # relay on 2026-09-04, with every source-reading test green throughout. Only asking the
      # live endpoint can tell "the fix shipped" apart from "the fix is in effect".
      #
      # This job is what `deploy` needs:, so the probe is BLOCKING — a promotion cannot ship
      # while the relay is open. It needs no credentials: being refused without one is the
      # whole assertion. A 400 would be a FAILING answer, it means the caller got past auth.
      # ─────────────────────────────────────────────────────────────────────────────────────
      - name: Live-probe guard suites (real deployed projects)
        run: node scripts/run-guards.mjs --live
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet --user --break-system-packages semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  # ===========================================================================
  # STAGING GATE - production cannot ship a build tree staging never ran.
  #
  # THE DEFECT THIS CLOSES (board row
  # `distribution-os-can-release-code-to-production-that-neve`, measured
  # 2026-09-12): `deploy` needed only [gate-security]. Staging lives in a
  # SEPARATE workflow (deploy-staging.yml, on a push to the `staging` branch),
  # so NOTHING tied a production promotion to a staging run having happened,
  # let alone having passed. `gh workflow run deploy.yml -f confirm=deploy` on
  # a master commit that had never been near `staging` shipped it straight to
  # production. Cockpit gates prod behind its staging jobs; this repo did not.
  #
  # WHY TREE HASHES AND NOT A FILE-LIST COMPARE. `staging` and `master` are
  # different branches, so the promoted SHA usually is not the staged SHA and a
  # SHA-equality test would refuse every honest release. The GitHub compare API
  # is the other obvious route and it is a trap: its `files[]` array is CAPPED
  # AT 300 ENTRIES, returns HTTP 200 with no truncation flag, and cuts off in
  # PATH ORDER - so a bulk docs change pushes every `app/` path off the end and
  # the gate reads "docs only" over changed application code (Cockpit hit
  # exactly this; cockpit#76). `git rev-parse <sha>:<dir>` returns the tree
  # object id, which is an exact content fingerprint of that directory with no
  # cap, no pagination and no API call. Equal tree ids mean byte-identical
  # trees; nothing else does.
  #
  # WHAT IS COMPARED: app/ (what is built and uploaded), scripts/ (the guard
  # suites both workflows run) and supabase/ (migrations applied to prod and
  # the edge functions). Docs, .claude/ and design-screens/ are deliberately
  # NOT compared - they are not build inputs, and demanding they match would
  # make a docs commit on master unreleasable.
  #
  # FAIL-CLOSED, EVERY BRANCH. Unreadable API, zero green staging runs, a
  # head_sha this checkout cannot resolve, an unresolvable tree - all refuse.
  # A gate that cannot look has not passed: an unknown is never an all-clear.
  #
  # NO `gh`, NO `jq` - curl and grep only (2026-09-14). The first version of this
  # gate read the staging runs with `gh run list ... 2>/dev/null || RUNS=""`. On
  # our own runners `gh` is NOT on the runner service's PATH: it was installed
  # after the service was configured, the service's cached PATH predates it, and
  # passwordless sudo is deliberately absent so the service cannot be restarted
  # to pick it up. So the command died with exit 127, the `2>/dev/null` swallowed
  # "gh: command not found", `RUNS` came back empty and the gate REFUSED EVERY
  # PROMOTION - the whole product unreleasable, with a message blaming staging.
  # Measured: run 34850548147, gate-staging failed at the runs read, before any
  # tree was compared. This is the identical fault BackOffice, Cockpit and
  # ChannelMover each hit on 2026-08-25; see the same note in ChannelMover's
  # deploy.yml. A DEPLOY GATE MUST NOT DEPEND ON A TOOL THAT HAPPENS TO BE ON THE
  # HOST, and a gate that can halt the fleet must be able to un-halt it.
  #
  # The two unknowns are now told apart and both still refuse: "the API would not
  # answer" prints the HTTP code, "the API answered and staging has never gone
  # green" says so. A refusal you cannot act on is how a halt becomes permanent.
  # ===========================================================================
  gate-staging:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      # Listing another workflow's runs needs actions:read. Stated rather than
      # inherited: a repository-level default of "contents: read" would make this
      # gate refuse every promotion again, and the refusal would read as staging's
      # fault rather than the token's.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history AND the staging branch: rev-parse must be able to
          # resolve a head_sha that lives only on `staging`.
          fetch-depth: 0
      - name: Fetch every ref (the staged commits are not on master)
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Refuse to promote a build tree staging never ran
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROMOTING_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # The directories that decide what production actually serves.
          BUILD_INPUTS="app scripts supabase"

          fingerprint() {
            # Tree object id per build-input dir, or empty on ANY failure.
            local sha="$1" out="" t=""
            for d in $BUILD_INPUTS; do
              t=$(git rev-parse "$sha:$d" 2>/dev/null) || return 1
              [ -n "$t" ] || return 1
              out="$out $d=$t"
            done
            printf '%s' "$out"
          }

          WANT=$(fingerprint "$PROMOTING_SHA") || {
            echo "REFUSING: cannot read the build-input trees of the commit being promoted ($PROMOTING_SHA). A gate that cannot look has not passed."
            exit 1
          }
          echo "Promoting $PROMOTING_SHA"
          echo "  build-input trees:$WANT"

          # Successful deploy-staging.yml runs, newest first, read over the REST API
          # with curl. `status=success` filters SERVER-SIDE, so every head_sha in
          # the payload belongs to a run that actually went green - which is what
          # makes reading it without jq safe: nothing has to be paired up by
          # position. -f makes curl fail (empty output, non-zero) on any non-2xx,
          # so a 403/404/429 error BODY can never reach grep as if it were content.
          API="https://api.github.com/repos/$GH_REPO"
          RUNS_URL="$API/actions/workflows/deploy-staging.yml/runs?status=success&per_page=100"

          # The body and the status code come back together in one variable, with no
          # temp file: a fixed path like /tmp/x.json is one more thing that can be
          # unwritable on a host nobody checked, and this gate has already been
          # brought down once by assuming something about the machine.
          RESP=$(curl -sS -m 30 -w $'\n%{http_code}' \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   -H "X-GitHub-Api-Version: 2022-11-28" \
                   "$RUNS_URL") || RESP=$'\n000'
          HTTP=$(printf '%s' "$RESP" | tail -n 1)
          BODY=$(printf '%s' "$RESP" | sed '$d')

          if [ "$HTTP" != "200" ]; then
            echo "REFUSING: THE GATE COULD NOT LOOK. GET /actions/workflows/deploy-staging.yml/runs answered HTTP $HTTP ('000' means the request never completed). This is NOT a statement about staging - it is this gate being unable to read, and an unknown is never an all-clear."
            echo "Check that the job's GITHUB_TOKEN still has 'actions: read' (declared on this job) and that the runner can reach api.github.com. Until it can, NO promotion can pass, so fix this before anything else."
            exit 1
          fi

          # Real JSON keys are "head_sha": with clean quotes; the same string inside
          # any nested body would be backslash-escaped and does not match.
          SHAS=$(printf '%s' "$BODY" | grep -o '"head_sha": *"[0-9a-f]\{40\}"' | awk -F'"' '{print $4}')

          if [ -z "$SHAS" ]; then
            echo "REFUSING: the API answered 200 but reports ZERO successful deploy-staging.yml runs. Staging has never gone green (or every green run has aged out of the API's window), so there is nothing this promotion could have been proven against."
            echo "Push to the \`staging\` branch, let deploy-staging.yml go green, then promote."
            exit 1
          fi

          UNRESOLVED=0
          CHECKED=0
          for SHA in $SHAS; do
            CHECKED=$((CHECKED + 1))
            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              UNRESOLVED=$((UNRESOLVED + 1))
              continue
            fi
            GOT=$(fingerprint "$SHA") || { UNRESOLVED=$((UNRESOLVED + 1)); continue; }
            if [ "$GOT" = "$WANT" ]; then
              # The matching run's id is fetched back by head_sha - a second
              # server-side filter, so the id named here provably belongs to THIS
              # commit's staging run and was not paired up by position.
              RUN_ID=$(curl -fsS -m 30 \
                         -H "Authorization: Bearer $GH_TOKEN" \
                         -H "Accept: application/vnd.github+json" \
                         "$API/actions/workflows/deploy-staging.yml/runs?status=success&head_sha=$SHA&per_page=1" \
                         | grep -o '"id": *[0-9]*' | head -1 | awk '{print $2}') || RUN_ID=""
              echo "STAGING GATE PASSED: staging was built from $SHA (deploy-staging run ${RUN_ID:-unknown}), whose build-input trees are byte-identical to the commit being promoted."
              echo "  matched trees:$GOT"
              exit 0
            fi
          done

          echo "REFUSING TO PROMOTE. Read $CHECKED successful deploy-staging.yml run(s) ($UNRESOLVED of them had a head_sha this checkout could not resolve) and NOT ONE of them built the app/, scripts/ and supabase/ trees that $PROMOTING_SHA carries."
          echo "This commit's application code has never run on staging. Push it to the \`staging\` branch, let deploy-staging.yml and e2e-staging go green, then promote."
          exit 1

  deploy:
    if: github.event.inputs.confirm == 'deploy'
    needs: [gate-security, gate-staging]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      # ─────────────────────────────────────────────────────────────────────────────────────
      # STAGING GATE (deploy-standard §4a, added 2026-09-12). Staging here is branch-based
      # (push `staging` -> deploy-staging.yml), so the fleet's "a green staging run for THIS
      # commit" never matches: the promoted master commit and the staged commit are different
      # commits even when they carry the same files. Nothing checked at all, and it showed:
      # on 2026-09-02 f45cf25c went to production while staging held f4608322, 9 code files
      # apart — code that never ran on staging.
      #
      # So compare FILES, not commit ids: production may ship only a tree that a green
      # deploy-staging.yml run already carried (deploy + E2E), or one that differs from it
      # only in docs. Runs FIRST, before the database is migrated. Fail-closed: an unreadable
      # answer is a refusal, never a pass. curl + grep only — `gh`/`jq` are not on this
      # runner's PATH (see ReplyFlow's gate).
      #
      # Refused? Bring staging up to the commit first: `git push origin master:staging`
      # (or merge master into staging), wait for "Deploy to Staging" to go green, promote again.
      # ─────────────────────────────────────────────────────────────────────────────────────
      - name: Verify staging gate (these exact files already passed staging + E2E)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="${{ github.sha }}"
          API="https://api.github.com/repos/$GH_REPO"
          # -f: any non-2xx is empty output, so an error body can never be parsed as content.
          api() { curl -fsS -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1" | tr -d '\n' || true; }
          tree_of() { api "$API/git/commits/$1" | grep -o '"tree": *{[^}]*}' | head -1 | grep -o '[0-9a-f]\{40\}' | head -1 || true; }
          SAFE='^(docs/|.*\.md$|README|LICENSE|\.gitignore$|\.gitleaks\.toml$|\.gitleaksignore$)'

          WANT=$(tree_of "$SHA")
          [ -n "$WANT" ] || { echo "::error::Could not read the tree of $SHA. Nothing was deployed."; exit 1; }
          BASES=$(api "$API/actions/workflows/deploy-staging.yml/runs?status=success&per_page=30" \
                    | grep -o '"head_sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | awk '!seen[$0]++' | head -10 || true)
          [ -n "$BASES" ] || { echo "::error::Could not read a single green staging run. Nothing was deployed."; exit 1; }

          for BASE in $BASES; do
            if [ "$(tree_of "$BASE")" = "$WANT" ]; then
              echo "Staging gate passed: $SHA carries exactly the files of staged commit $BASE."; exit 0
            fi
            # Docs-only on top of a staged commit. Only "ahead" is trusted: there the compare
            # base IS the staged commit, so its file list is the full difference. "behind"
            # always lists no files and "diverged" lists them from a merge base, not from staging.
            CMP=$(api "$API/compare/$BASE...$SHA")
            printf '%s' "$CMP" | grep -q '"status": *"ahead"' || continue
            FILES=$(printf '%s' "$CMP" | grep -o '"\(previous_\)\{0,1\}filename": *"[^"]*"' | sed 's/.*: *"//; s/"$//' || true)
            COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
            [ "$COUNT" -gt 0 ] && [ "$COUNT" -lt 300 ] || continue
            if ! printf '%s\n' "$FILES" | grep -vqE "$SAFE"; then
              echo "Staging gate passed: $SHA differs from staged commit $BASE only in docs ($COUNT file(s))."; exit 0
            fi
          done
          echo "::error::$SHA carries files that no green staging run has carried. Push it to staging first (git push origin master:staging), wait for 'Deploy to Staging' to go green, then promote. Nothing was deployed."
          exit 1

      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml
          cache-dependency-path: app/package-lock.json

      # Migrations ship BEFORE any code (ReplyFlow drift fix 2026-08-21, proven
      # BackOffice route): the database is migrated first, so a migration failure
      # fails the deploy loudly instead of shipping code against a stale schema.
      - name: Apply database migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref jxjpbmkgmuunpayqgbsx

      - name: Cache node_modules
        id: node-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('app/package-lock.json') }}
      - name: Install deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: app

      - name: Coverage
        run: npm run test:coverage
        working-directory: app

      # NOT `working-directory: app`, and that is the entire point. The coverage run above uses
      # app/vitest.config.ts, whose include is 'src/**' relative to app/, so it cannot see a
      # *.test.mjs under supabase/ - two directory levels outside it. Measured 2026-09-03:
      # supabase/functions/_shared/smtp-retry.test.mjs (13 checks, all passing) had never been
      # executed by CI once. Nobody skipped it; it was unreachable, and unreachable looked exactly
      # like green. This step DISCOVERS every *.test.mjs from the repo root instead of naming any,
      # and fails if discovery matches nothing, because absence is not success.
      - name: Guard suites (discovered, not listed)
        run: node scripts/run-guards.mjs

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Launched 2026-08-02: disable the pre-launch Early-Access gate in production.
          # The gate component/tests remain; flip to remove this line to re-enable.
          VITE_PASSWORD_GATE_DISABLED: 'true'

      - name: Deploy via FTP (zero-downtime)
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUT=$(lftp…) on the
          # first failure BEFORE the retry loops below can iterate (dead-retry, deploy-standard §3f).
          set +e
          sudo apt-get install -y lftp
          FTP_CONN="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }};"

          echo "distributionos" > ./app/dist/.site-id

          REMOTE_ID=$(timeout 90 lftp -e "${FTP_CONN} cat /distributionos.predivo.ch/.site-id; quit" 2>/dev/null || echo "")
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "distributionos" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'distributionos'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Step 1: Upload new hashed assets alongside old ones (no deletion yet)
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -e "
              $FTP_CONN
              mirror --reverse --no-perms --verbose ./app/dist/assets/ /distributionos.predivo.ch/assets/;
              quit;
            " 2>&1)
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::failed after 4"; exit 1; }
            echo "::warning::attempt $n retry 25s"
            sleep 25
          done

          # Step 2: Upload index.html + root files (switches to new asset references)
          n=0
          until [ $n -ge 4 ]; do
            OUT=$(timeout 420 lftp -e "
              $FTP_CONN
              put ./app/dist/.site-id -o /distributionos.predivo.ch/.site-id;
              put ./app/dist/index.html -o /distributionos.predivo.ch/index.html;
              put ./app/dist/.htaccess -o /distributionos.predivo.ch/.htaccess;
              put ./app/dist/favicon.svg -o /distributionos.predivo.ch/favicon.svg;
              put ./app/dist/favicon.ico -o /distributionos.predivo.ch/favicon.ico;
              put ./app/dist/apple-touch-icon.png -o /distributionos.predivo.ch/apple-touch-icon.png;
              put ./app/dist/android-chrome-192x192.png -o /distributionos.predivo.ch/android-chrome-192x192.png;
              put ./app/dist/android-chrome-512x512.png -o /distributionos.predivo.ch/android-chrome-512x512.png;
              put ./app/dist/og-image.png -o /distributionos.predivo.ch/og-image.png;
              put ./app/dist/site.webmanifest -o /distributionos.predivo.ch/site.webmanifest;
              put ./app/dist/robots.txt -o /distributionos.predivo.ch/robots.txt;
              put ./app/dist/sitemap.xml -o /distributionos.predivo.ch/sitemap.xml;
              quit;
            " 2>&1)
            RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && break
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can actually appear: at
            # the start of a line, or straight after lftp's "Access failed:", and followed by
            # whitespace + a word. A bare '530' substring matched a hashed ASSET FILENAME on
            # 2026-09-02 (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf) and killed a
            # perfectly healthy deploy with "stale secret, not retrying" - the one verdict that
            # deliberately does NOT retry. Shared test: gate-kit test/ftp-reply-code-guard.test.mjs.
            echo "$OUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)' && { echo "::error::FTP auth 530 not retrying"; exit 1; }
            n=$((n+1))
            [ $n -ge 4 ] && { echo "::error::failed after 4"; exit 1; }
            echo "::warning::attempt $n retry 25s"
            sleep 25
          done

          # Old hashed assets are NOT deleted at deploy time: a browser tab still
          # running the old index.html fetches the old chunks lazily, and deleting
          # them turns that into "Failed to fetch dynamically imported module"
          # (fleet standard §5a). They are pruned by AGE (14 days) in the
          # "Prune stale assets" step after the smoke test below.

      - name: Post-deploy smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://distributionos.predivo.ch/" || echo 000)
          if [ "$STATUS" = "200" ]; then
            echo "OK  https://distributionos.predivo.ch/ -> $STATUS"
          else
            echo "::error::Smoke test failed: https://distributionos.predivo.ch/ -> $STATUS"
            exit 1
          fi

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the no-delete asset upload above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659, supported by the ProFTPD on this host) and deletes files older than
        # 14 days. 14 days ≫ any realistically open tab, so stale-tab chunk fetches 404
        # only for sessions older than the retention window.
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: distributionos.predivo.ch/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively —
            # nested chunk dirs are covered too); normalize to a path relative to
            # ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0
