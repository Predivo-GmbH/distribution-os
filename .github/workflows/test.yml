name: Critical Path Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GUARD SUITES - the *.test.mjs files, DISCOVERED rather than named.
  #
  # This job exists because master had no path that ran them. deploy-staging.yml fires on the
  # `staging` branch and deploy.yml is manual-only, so on the DEFAULT branch the only workflows
  # were this one and gitleaks. Measured 2026-09-03:
  # supabase/functions/_shared/smtp-retry.test.mjs - 13 checks, all passing, the guard against the
  # "Connection timeout" mail failure that hit SignalScore in production - had never been executed
  # by CI once. Nobody skipped it: app/vitest.config.ts includes 'src/**' relative to app/, so a
  # file under supabase/ is invisible to the only test runner this repo has. Unreachable looked
  # exactly like green.
  #
  # Its OWN job, not a step inside critical-path, for two reasons: that job is a heavy Playwright
  # run and a browser flake must not be confusable with a guard regression, and these suites need
  # no npm ci, no browsers and no secrets - so this answers in seconds and fails fast.
  guards:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No `npm ci`: every discovered suite is dependency-free by design (they import the .ts
      # module under test directly, via --experimental-strip-types). If that ever stops being
      # true the suite fails loudly here rather than being quietly dropped.
      - name: Guard suites (discovered, not listed)
        run: node scripts/run-guards.mjs

  critical-path:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Pick a free dev-server port
        # ~24 runners for 14 repositories share ONE network namespace on the self-hosted host,
        # so a fixed 5183 collides with any leftover or concurrent dev server. Ask the OS for a
        # free port instead. app/playwright.config.ts reads E2E_PORT and passes Vite
        # --strictPort, so a port taken in the gap before Vite binds fails the run loudly rather
        # than silently testing whatever else is listening. See deploy-standard.md RULE 3.
        run: |
          PORT=$(node -e "const s=require('net').createServer();s.listen(0,()=>{const p=s.address().port;s.close(()=>console.log(p))})")
          echo "E2E_PORT=$PORT" >> "$GITHUB_ENV"
          echo "dev server port: $PORT"

      # password-gate.spec.ts is run here as well as critical-path. It is the only
      # spec that types the live access code, and until 2026-09-02 nothing ran it,
      # so the DISTOS_GATE_PASSWORD secret existed but was consumed by no job — the
      # gate could break, or the secret could go stale, with nothing to say so.
      # The spec throws a named error when DISTOS_GATE_PASSWORD is unset, so a
      # missing or deleted secret fails this step loudly instead of passing empty.
      - name: Run critical path and password-gate tests
        run: npx playwright test e2e/critical-path.spec.ts e2e/password-gate.spec.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DISTOS_GATE_PASSWORD: ${{ secrets.DISTOS_GATE_PASSWORD }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critical-path-results
          path: app/playwright-report/
