name: Test & Coverage
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm run test:ci
      - name: Coverage
        run: npm run test:coverage
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Critical Path E2E (MUST PASS)
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_GATE_DISABLED: 'true'
      - name: E2E Tests
        run: npm run test:e2e
        continue-on-error: true
        env:
          VITE_PASSWORD_GATE_DISABLED: 'true'
      - name: Accessibility Tests
        run: npm run test:a11y
        timeout-minutes: 5
        continue-on-error: true
        env:
          VITE_PASSWORD_GATE_DISABLED: 'true'
      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        continue-on-error: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7
