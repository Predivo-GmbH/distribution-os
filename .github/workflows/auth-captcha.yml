name: Auth CAPTCHA switch

# THE SETTING THAT IS THE FIX. Closing the unauthenticated sign-in-email hole has two halves and
# only one is code. Half 2 is not a deploy — it is one project-wide GoTrue setting
# (security_captcha_enabled + provider + secret). Nothing in this repo could reach it, so on
# ReplyFlow that half sat undone behind a green deploy for four days while the row read "shipped".
# This workflow is how Distribution-OS's gets flipped, read back and rolled back, by anyone, on the
# record, with the management token only CI holds, and without a secret ever being rendered.
#
# ORDER: the client half must be LIVE on the target project first — every auth form actually
# sending a cf-turnstile-response — or enabling this locks every customer out of login, signup,
# login-by-code and password reset (this client calls /token, /signup, /otp and /recover, and the
# captcha gate is project-wide). Both deploy workflows now assert the site key is inlined in the
# shipped bundle, which is the machine-checkable half of that precondition.
# ROLLBACK: run it again with mode=disable. Instant and total.

on:
  # A DAILY READ, BECAUSE THE ONLY OTHER WITNESS WAS THE THING IT BLOCKED.
  # Measured on ReplyFlow 2026-09-11: production's switch was flipped ON and the fleet deploy page
  # went on showing red for TWELVE HOURS against a pre-flip gate run. The cause is a deadlock — the
  # guard ran in exactly two places, inside a production promotion and by hand, so the only run that
  # could record the switch as green was a promotion, and the promotion was being refused by that
  # same gate's stale red. A scheduled read breaks the loop, and it also catches the opposite case
  # (somebody turning captcha OFF) within a day instead of at the next promotion — which is the
  # case that actually costs customers.
  #
  # report mode is READ-ONLY: it prints booleans, names and value shapes, never a secret.
  schedule:
    # 05:55 UTC — off the hour and clear of the fleet's other jobs (ReplyFlow 05:40, LaunchReady 05:50).
    - cron: '55 5 * * *'

  workflow_dispatch:
    inputs:
      project:
        description: Which Supabase project
        required: true
        default: production
        type: choice
        options: [production, staging]
      mode:
        description: report (read-only) | enable | disable (rollback)
        required: true
        default: report
        type: choice
        options: [report, enable, disable]

# One writer at a time on a project's auth config: two of these racing would leave the switch in a
# state neither run reported.
concurrency:
  group: auth-captcha-${{ inputs.project || 'production' }}
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ${{ inputs.mode || 'report' }} CAPTCHA on ${{ inputs.project || 'production' }}
        env:
          DIST_MGMT_TOKEN: ${{ secrets.DIST_MGMT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The Cloudflare Turnstile SECRET key for the Distribution-OS sign-in widget (site key
          # 0x4AAAAAAEz4thUGbxYbUP3e). It cannot be read back out of the Supabase project:
          # edge-function secrets are stored write-only and GET /v1/projects/{ref}/secrets returns a
          # SHA-256 digest, not the value. This repository secret is the one usable source.
          # `enable` asks Cloudflare to confirm it is genuine before touching Supabase, so a
          # wrong-but-plausible value cannot become a silent, total customer lockout.
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: node scripts/auth-captcha.mjs ${{ inputs.mode || 'report' }} --project ${{ inputs.project || 'production' }}

      # A FLIP THAT IS NOT PROBED IS A CLAIM. This is the same guard run-guards.mjs discovers: it
      # POSTs a tokenless /otp at the live project and asserts it is refused FOR CAPTCHA REASONS.
      #
      # THE RETRY IS ON THE ENABLE PATH ONLY, AND IT IS NOT COSMETIC. GoTrue does not apply the new
      # auth config the instant the Management API PATCH returns. Measured on Beize Jass Tour
      # 2026-09-15: the flip fully succeeded and the probe, run ~0.6s later, still got
      # `422 otp_disabled` — so the run concluded FAILURE for a switch that was working. LaunchReady
      # hit the same thing on 2026-09-14 and it was re-run rather than fixed, which is how it
      # reached this template. A red run meaning "flipped fine, checked too early" is
      # indistinguishable from "the flip failed", and the next person either rolls back a healthy
      # switch or learns to ignore a red enable run. Both are worse than waiting a minute.
      #
      # The bound is short and the final failure is KEPT: a project that is genuinely still open is
      # still open 60 seconds later, so this cannot paper over a real failure. And the loop lives
      # HERE, never inside signin-captcha.prod.test.mjs — that file is also the daily standing
      # guard, and a retry inside it would start hiding genuine regressions.
      - name: Prove the switch actually took (GoTrue needs a moment to propagate)
        if: inputs.mode == 'enable'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          STAGING_VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if node supabase/functions/_shared/signin-captcha.prod.test.mjs; then exit 0; fi
            echo "not propagated yet (attempt $i of 6); waiting 10s"
            sleep 10
          done
          echo "FAIL - 60s after the PATCH the project still does not refuse a tokenless request."
          exit 1

      # THE DAILY STANDING READ — no retry, deliberately. Nothing has just been changed here, so a
      # refusal that does not come back is a real regression and must be reported as one. A daily
      # read that never probed would report the SETTING and not the BEHAVIOUR, and it is the
      # behaviour that went stale for twelve hours on ReplyFlow.
      - name: Prove it against the live project (daily read)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          STAGING_VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
        run: node supabase/functions/_shared/signin-captcha.prod.test.mjs
